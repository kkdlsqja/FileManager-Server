spring:
  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

filemanager:
  pc-identifier: "folderhelper-computer-01"

  browse-root-directory: "${FILEMANAGER_DESKTOP:${user.home}/Desktop}"
  root-directory: "${FILEMANAGER_WATCH_FOLDER:${FILEMANAGER_DESKTOP:${user.home}/Desktop}/FolderHelperTest}"

  destinations:
    school: "${FILEMANAGER_SCHOOL_FOLDER:${FILEMANAGER_DESKTOP:${user.home}/Desktop}/학교}"
    work: "${FILEMANAGER_WORK_FOLDER:${FILEMANAGER_DESKTOP:${user.home}/Desktop}/업무}"
    travel: "${FILEMANAGER_TRAVEL_FOLDER:${FILEMANAGER_DESKTOP:${user.home}/Desktop}/여행}"
    personal: "${FILEMANAGER_PERSONAL_FOLDER:${FILEMANAGER_DESKTOP:${user.home}/Desktop}/개인}"
    unclassified: "${FILEMANAGER_UNCLASSIFIED_FOLDER:${FILEMANAGER_DESKTOP:${user.home}/Desktop}/미분류}"

  classification:
    keywords:
      school:
        - "과제"
        - "강의"
        - "수업"
        - "학교"
        - "시험"
        - "졸업"
      work:
        - "업무"
        - "회의"
        - "보고서"
        - "계약"
        - "영수증"
        - "회사"
      travel:
        - "여행"
        - "항공"
        - "호텔"
        - "숙소"
        - "여행지"
      personal:
        - "가족"
        - "개인"
        - "취미"