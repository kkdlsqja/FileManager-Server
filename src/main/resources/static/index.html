<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MVP 테스트 페이지</title>
</head>
<body>
    <h2>1. 회원가입</h2>
    <form action="/api/auth/signup" method="post">
        이메일: <input type="text" name="email" placeholder="새 이메일 입력"><br><br>
        비밀번호: <input type="password" name="password" placeholder="새 비밀번호 입력"><br><br>
        <button type="submit">회원가입 하기</button>
    </form>

    <hr>

    <h2>2. 로그인</h2>
    <form action="/api/auth/login" method="post">
        이메일: <input type="text" name="email" value="test@test.com"><br><br>
        비밀번호: <input type="password" name="password" value="1234"><br><br>
        <button type="submit">로그인 하기</button>
    </form>

    <hr>

    <h2>3. 로그아웃</h2>
    <form action="/api/auth/logout" method="post">
        <button type="submit">로그아웃 하기</button>
    </form>

    <hr>

    <h2>4. 사용자 인증 확인</h2>
    <p>브라우저 주소창에 직접 <code>http://localhost:8080/api/auth/verify</code> 를 치거나, 나중에 앱에서 토큰을 실어 보내는 백엔드 검증 로직입니다.</p>
</body>
</html>
